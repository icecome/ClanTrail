# 项目级 cargo 源配置：使用 rsproxy.cn 国内镜像 + sparse 协议加速 crate 拉取
# 仅作用于本工程，删除本文件即恢复默认 crates.io 源。
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true

# Android 交叉编译链接器（NDK 25 clang）。需先安装 Rust android 目标：
#   rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
# 本环境因网络限制无法获取 rust android std，故此处仅预置链接器配置，供可联网机器出 APK 使用。
[target.aarch64-linux-android]
linker = "C:/opt/workstations/project/apps/muji/tomb-keeper/android-sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android21-clang.cmd"
