[package]
name = "clantrail-tauri"
version = "0.1.0"
description = "ClanTrail desktop/mobile shell with embedded Axum backend"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clantrail_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "clantrail-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
clantrail-core = { path = "../../src-core" }
clantrail-server = { path = "../../src-server" }
tauri-plugin-geolocation = "2"
tauri-plugin-opener = "2"
