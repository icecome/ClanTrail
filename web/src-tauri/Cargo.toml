[package]
name = "tomb-keeper-tauri"
version = "0.1.0"
description = "Tomb Keeper desktop/mobile shell with embedded Axum backend"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tomb_keeper_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "tomb-keeper-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart"] }
tomb-keeper-core = { path = "../../src-core" }
tomb-keeper-server = { path = "../../src-server" }
