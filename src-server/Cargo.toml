[package]
name = "tomb-keeper-server"
version = "0.1.0"
edition = "2021"
description = "Axum HTTP API server for Tomb Keeper (Web 端)"

[lib]
name = "tomb_keeper_server"
path = "src/lib.rs"

[[bin]]
name = "tomb-keeper-server"
path = "src/main.rs"

[dependencies]
tomb-keeper-core = { path = "../src-core" }
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
walkdir = "2"
chrono = "0.4"